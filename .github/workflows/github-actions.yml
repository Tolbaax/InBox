name: CI/CD Build & Distribute 🚀

on:
  push:
    branches: [ master, Development ]
  pull_request:
    branches: [ master ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  get-info:
    runs-on: ubuntu-latest
    outputs:
      branch: ${{ steps.meta.outputs.branch }}
      project: ${{ steps.meta.outputs.project }}
      author: ${{ steps.meta.outputs.author }}
      datetime: ${{ steps.meta.outputs.datetime }}
      commit_message: ${{ steps.meta.outputs.commit_message }}
    steps:
      - uses: actions/checkout@v4

      - name: Collect metadata
        id: meta
        run: |
          echo "branch=${GITHUB_REF#refs/heads/}" >> "$GITHUB_OUTPUT"
          echo "project=${GITHUB_REPOSITORY#*/}" >> "$GITHUB_OUTPUT"
          echo "author=$(git log -1 --pretty=%an)" >> "$GITHUB_OUTPUT"
          echo "datetime=$(git log -1 --pretty=%cd --date=format:'%B %d, %Y %I:%M %p')" >> "$GITHUB_OUTPUT"
          {
            echo "commit_message<<EOF"
            git log -1 --pretty=%B
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

  build-and-distribute:
    name: Build & Distribute
    runs-on: ubuntu-latest
    needs: get-info
    steps:
      - uses: actions/checkout@v4

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          flutter-version: '3.41.3'
          cache: true

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('android/**/*.gradle*') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Generate Firebase Options
        run: |
          mkdir -p lib/core/utils
          cat > lib/core/utils/firebase_options.dart << 'EOF'
          ${{ secrets.FIREBASE_OPTIONS_DART }}
          EOF

      - name: Decode Keystore
        run: echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > android/app/upload-keystore.jks

      - name: Generate key.properties
        run: |
          cat > android/key.properties << EOF
          storePassword=${{ secrets.KEYSTORE_PASSWORD }}
          keyPassword=${{ secrets.KEY_PASSWORD }}
          keyAlias=${{ secrets.KEY_ALIAS }}
          storeFile=upload-keystore.jks
          EOF

      - name: Install dependencies
        run: flutter pub get

      - name: Build APK (release)
        run: |
          flutter build apk \
            --release \
            --obfuscate \
            --split-debug-info=build/debug-info

      - name: Build App Bundle (release)
        run: |
          flutter build appbundle \
            --release \
            --obfuscate \
            --split-debug-info=build/debug-info

      - name: Verify build outputs
        run: |
          APK="build/app/outputs/flutter-apk/app-release.apk"
          AAB="build/app/outputs/bundle/release/app-release.aab"
          for f in "$APK" "$AAB"; do
            if [ ! -f "$f" ]; then echo "❌ Missing $f"; exit 1; fi
            echo "✅ $f ($(du -h "$f" | cut -f1))"
          done

      - name: Upload debug symbols
        uses: actions/upload-artifact@v4
        with:
          name: debug-info-${{ needs.get-info.outputs.branch }}-${{ github.run_number }}
          path: build/debug-info
          retention-days: 90
          if-no-files-found: error

      - name: Cleanup signing files
        if: always()
        run: rm -f android/app/upload-keystore.jks android/key.properties

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: apk-${{ needs.get-info.outputs.branch }}-${{ github.run_number }}
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 7
          if-no-files-found: error

      - name: Upload AAB artifact (for Play Store upload)
        uses: actions/upload-artifact@v4
        with:
          name: aab-${{ needs.get-info.outputs.branch }}-${{ github.run_number }}
          path: build/app/outputs/bundle/release/app-release.aab
          retention-days: 30
          if-no-files-found: error

      - name: Distribute APK to Firebase (testers)
        continue-on-error: true
        uses: wzieba/Firebase-Distribution-Github-Action@v1
        with:
          appId: ${{ secrets.FIREBASE_APP_ID }}
          serviceCredentialsFileContent: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          groups: testers
          file: build/app/outputs/flutter-apk/app-release.apk
          releaseNotes: |
            🚀 New build from ${{ needs.get-info.outputs.branch }} branch
            📝 ${{ needs.get-info.outputs.commit_message }}
            👤 ${{ needs.get-info.outputs.author }}
            📅 ${{ needs.get-info.outputs.datetime }}

  notify:
    runs-on: ubuntu-latest
    needs: [get-info, build-and-distribute]
    if: always()
    steps:
      - name: Determine status
        id: status
        run: |
          if [ "${{ needs.build-and-distribute.result }}" == "success" ]; then
            echo "status=SUCCESS" >> "$GITHUB_OUTPUT"
            echo "icon=✅" >> "$GITHUB_OUTPUT"
          else
            echo "status=FAILED" >> "$GITHUB_OUTPUT"
            echo "icon=❌" >> "$GITHUB_OUTPUT"
          fi

      - name: Send email notification
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          username: ${{ secrets.GMAIL_USERNAME }}
          password: ${{ secrets.GMAIL_PASSWORD }}
          from: ${{ secrets.GMAIL_USERNAME }}
          to: tolbaax@gmail.com
          subject: "${{ steps.status.outputs.icon }} Build ${{ steps.status.outputs.status }} - ${{ needs.get-info.outputs.project }}"
          body: |
            Build Status: ${{ steps.status.outputs.icon }} ${{ steps.status.outputs.status }}

            Project: ${{ needs.get-info.outputs.project }}
            Branch: ${{ needs.get-info.outputs.branch }}
            Build #: ${{ github.run_number }}

            Author: ${{ needs.get-info.outputs.author }}
            Date: ${{ needs.get-info.outputs.datetime }}
            Commit: ${{ needs.get-info.outputs.commit_message }}

            View details: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}

            ---
            Automated notification from CI/CD pipeline