name: CI/CD Build APK & Distribute 🚀

on:
  push:
    branches: [ master, Development ]
  pull_request:
    branches: [ master ]
  workflow_dispatch:

jobs:
  get-info:
    runs-on: ubuntu-latest
    outputs:
      branch: ${{ steps.branch.outputs.value }}
      project: ${{ steps.project.outputs.value }}
      author: ${{ steps.author.outputs.value }}
      email: ${{ steps.email.outputs.value }}
      datetime: ${{ steps.datetime.outputs.value }}
      commit_message: ${{ steps.commit_message.outputs.value }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Get Branch Name
        id: branch
        run: echo "value=${GITHUB_REF#refs/heads/}" >> $GITHUB_OUTPUT

      - name: Get Project Name
        id: project
        run: echo "value=${GITHUB_REPOSITORY#*/}" >> $GITHUB_OUTPUT

      - name: Get Commit Author
        id: author
        run: echo "value=$(git log -1 --pretty=%an)" >> $GITHUB_OUTPUT

      - name: Get Commit Author Email
        id: email
        run: echo "value=$(git log -1 --pretty=%ae)" >> $GITHUB_OUTPUT

      - name: Get Commit Formatted Date
        id: datetime
        run: echo "value=$(git log -1 --pretty=%cd --date=format:'%B %d, %Y %I:%M %p')" >> $GITHUB_OUTPUT

      - name: Get Commit Message
        id: commit_message
        run: echo "value=$(git log -1 --pretty=%B)" >> $GITHUB_OUTPUT

  build-and-distribute:
    name: Build & Distribute Android APK
    runs-on: ubuntu-latest
    needs: get-info

    steps:
      # STEP 1: Checkout code
      - name: Checkout code
        uses: actions/checkout@v3
        with:
          fetch-depth: 0

      # STEP 2: Setup Java
      - name: Setup Java JDK 17
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '17'

      # STEP 3: Verify Java installation
      - name: Verify Java installation
        run: |
          echo "Checking Java version..."
          java -version
          echo "Java setup completed ✓"

      # STEP 4: Setup Flutter
      - name: Setup Flutter (Stable)
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      # STEP 5: Verify Flutter installation
      - name: Verify Flutter installation
        run: |
          echo "Checking Flutter installation..."
          flutter --version
          echo "Flutter setup completed ✓"

      # STEP 6: Install dependencies
      - name: Install Flutter dependencies
        run: |
          echo "Installing dependencies..."
          flutter pub get
          echo "Dependencies installed ✓"

      # STEP 7: Build APK
      - name: Build Android APK (Release)
        run: |
          echo "Building APK..."
          flutter build apk --release
          echo "APK build completed ✓"

      # STEP 8: Verify APK file
      - name: Verify APK file exists
        run: |
          echo "Verifying APK file..."
          if [ -f "build/app/outputs/apk/release/app-release.apk" ]; then
            echo "✅ APK file created successfully"
            echo "File location: build/app/outputs/apk/release/app-release.apk"
            echo "File size: $(du -h build/app/outputs/apk/release/app-release.apk | cut -f1)"
          else
            echo "❌ APK file not found!"
            ls -la build/app/outputs/apk/release/ || true
            exit 1
          fi

      # STEP 9: Upload to GitHub Artifacts
      - name: Upload APK to GitHub Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: android-apk-${{ needs.get-info.outputs.branch }}-${{ github.run_number }}
          path: build/app/outputs/apk/release/app-release.apk
          retention-days: 7
          if-no-files-found: error

      # STEP 10: Distribute to Firebase
      - name: Distribute to Firebase App Distribution
        uses: wzieba/Firebase-Distribution-Github-Action@v1
        with:
          appId: ${{ secrets.FIREBASE_APP_ID }}
          serviceCredentialsFileContent: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          groups: testers
          file: build/app/outputs/apk/release/app-release.apk
          releaseNotes: |
            🚀 New Build from ${{ needs.get-info.outputs.branch }} branch
            
            📝 Commit: ${{ needs.get-info.outputs.commit_message }}
            👤 Author: ${{ needs.get-info.outputs.author }}
            📅 Date: ${{ needs.get-info.outputs.datetime }}

  notify:
    runs-on: ubuntu-latest
    needs: [get-info, build-and-distribute]
    if: always()
    steps:
      - name: Determine build status
        id: status
        run: |
          if [ "${{ needs.build-and-distribute.result }}" == "success" ]; then
            echo "status=SUCCESS" >> $GITHUB_OUTPUT
            echo "icon=✅" >> $GITHUB_OUTPUT
          else
            echo "status=FAILED" >> $GITHUB_OUTPUT
            echo "icon=❌" >> $GITHUB_OUTPUT
          fi

      - name: Send simple email notification
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          username: ${{ secrets.GMAIL_USERNAME }}
          password: ${{ secrets.GMAIL_PASSWORD }}
          from: ${{ secrets.GMAIL_USERNAME }}
          to: tolbaax@gmail.com
          subject: "${{ steps.status.outputs.icon }} Build ${{ steps.status.outputs.status }} - ${{ needs.get-info.outputs.project }}"
          body: |
            Build Status: ${{ steps.status.outputs.icon }} ${{ steps.status.outputs.status }}
            
            Project: ${{ needs.get-info.outputs.project }}
            Branch: ${{ needs.get-info.outputs.branch }}
            Build #: ${{ github.run_number }}
            
            Author: ${{ needs.get-info.outputs.author }}
            Date: ${{ needs.get-info.outputs.datetime }}
            Commit: ${{ needs.get-info.outputs.commit_message }}
            
            View details: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
            
            ---
            Automated notification from CI/CD pipeline