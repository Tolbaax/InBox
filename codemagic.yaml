workflows:
android-release:
name: Android Release

instance_type: mac_mini_m2

environment:
  flutter: 3.41.3

  android_signing:
    - inbox_release

  groups:
    - firebase
    - android_release

scripts:
  - name: Get Flutter packages
    script: |
      flutter pub get

  - name: Analyze
    script: |
      flutter analyze

  - name: Run tests
    script: |
      flutter test

  - name: Build obfuscated Android App Bundle
    script: |
      flutter build appbundle \
        --release \
        --obfuscate \
        --split-debug-info=build/debug-info/$CM_BUILD_ID

artifacts:
  - build/app/outputs/bundle/release/app-release.aab
  - build/debug-info/**

publishing:
  email:
    recipients:
      - tolbaax@gmail.com
    notify:
      success: true
      failure: true